<body>
<header><h2>A.G tyres stocks</h2></header>
<main>
<button type="button" class="add" id="addBtn">＋ Add Tyre</button>
<input id="search" placeholder="🔎 Search">
<div id="status" class="status">Connecting...</div>
<div id="list"></div>
</main>
<div class="modal" id="modal"><div class="box">
<h2 id="title">Add Tyre</h2>
<label>Brand</label><input id="brand">
<label>Model</label><input id="model">
<label>Size</label><input id="size" placeholder="225/40 R18">
<label>Date</label><input id="date" type="date">
<label>Stock</label><input id="stock" type="number" min="0" value="1">
<label>Sale price</label><input id="price" type="number" min="0" step="0.01">
<button type="button" class="save" id="saveBtn">Save Tyre</button>
<button type="button" class="cancel" id="cancelBtn">Cancel</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hdazflogbcmehlzsgoas.supabase.co';
const SUPABASE_KEY='sb_publishable_GGD7hEN2-KuXILCI75rjjA_O7AL1ahZ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let data=[],editId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(s){$('status').textContent=s;}
async function load(){
 setStatus('Loading stock...');
 const {data:rows,error}=await db.from('tyres').select('*').order('created_at',{ascending:false});
 if(error){setStatus('Database error: '+error.message);console.error(error);return;}
 data=rows||[];setStatus(data.length+' tyre(s) online');render();
}
function render(){
 const q=$('search').value.toLowerCase().trim();let out='';
 data.forEach(t=>{
  if(q&&!(`${t.brand} ${t.model} ${t.size} ${t.date||''}`).toLowerCase().includes(q))return;
  out+=`<div class="card"><b>${esc(t.brand)} ${esc(t.model)}</b><br>${esc(t.size)}<br>Date: <b>${esc(t.date||'—')}</b><br>Stock: <b>${Number(t.stock)||0}</b>${t.sale_price!==null&&t.sale_price!==''?`<br>Sale price: €${Number(t.sale_price).toFixed(2)}`:''}<div class="actions"><button type="button" class="edit" onclick="editTyre('${t.id}')">Edit</button><button type="button" class="delete" onclick="deleteTyre('${t.id}')">Delete</button></div></div>`;
 });
 $('list').innerHTML=out||'<p style="text-align:center;color:#777">No tyres in stock.</p>';
}
function openForm(id=null){
 editId=id;$('title').textContent=id?'Edit Tyre':'Add Tyre';
 if(!id){$('brand').value='';$('model').value='';$('size').value='';$('date').value='';$('stock').value=1;$('price').value='';}
 else {const t=data.find(x=>x.id===id);if(!t)return;$('brand').value=t.brand;$('model').value=t.model;$('size').value=t.size;$('date').value=t.date||'';$('stock').value=t.stock;$('price').value=t.sale_price??'';}
 $('modal').style.display='block';setTimeout(()=>$('brand').focus(),50);
}
function closeForm(){$('modal').style.display='none';editId=null;}
window.editTyre=id=>openForm(id);
window.deleteTyre=async id=>{if(!confirm('Delete this tyre?'))return;setStatus('Deleting...');const {error}=await db.from('tyres').delete().eq('id',id);if(error){alert(error.message);setStatus('Database error');return;}await load();};
$('addBtn').onclick=()=>openForm();$('cancelBtn').onclick=closeForm;$('search').oninput=render;
$('saveBtn').onclick=async()=>{
 const brand=$('brand').value.trim(),model=$('model').value.trim(),size=$('size').value.trim();
 if(!brand||!model||!size){alert('Please fill Brand, Model and Size');return;}
 const row={brand,model,size,date:$('date').value||null,stock:Math.max(0,Number($('stock').value)||0),sale_price:$('price').value===''?null:Number($('price').value)};
 $('saveBtn').disabled=true;setStatus('Saving...');
 let result;
 if(editId) result=await db.from('tyres').update(row).eq('id',editId); else result=await db.from('tyres').insert(row);
 $('saveBtn').disabled=false;
 if(result.error){alert(result.error.message);setStatus('Database error');return;}
 closeForm();await load();
};
load();
</script>
</body></html>
