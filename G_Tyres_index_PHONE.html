<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h1,h2{margin-top:0}
.hidden{display:none!important}
label{display:block;font-weight:700;margin:12px 0 5px}
input,select,button{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{background:#111;color:#fff;border:0;cursor:pointer;font-weight:700;margin-top:10px}
button.secondary{background:#555}
button.danger{background:#b00020}
button.small{width:auto;padding:8px 12px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stock{border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:10px}
.stock h3{margin:0 0 7px}
.muted{color:#666;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.top button{width:auto;margin:0}
.msg{padding:10px;border-radius:9px;background:#eee;margin-bottom:12px;white-space:pre-wrap}
.price{font-size:14px;font-weight:700;text-align:right;margin-top:8px}
.empty{text-align:center;color:#777;padding:20px}
.adminrow{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin-top:8px}
.adminrow button{width:auto;margin:0}
.suggest{font-size:12px;color:#666;margin-top:4px}
.password-wrap{position:relative}
.password-wrap input{padding-right:52px}
.eye-btn{position:absolute;right:7px;top:5px;width:42px;height:42px;padding:0;margin:0;border:0;background:transparent;color:#333;font-size:22px;line-height:42px}
.eye-btn:hover{background:#eee}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
.top{align-items:flex-start;flex-direction:column}
.top button{width:100%}
}

/* Mobile-first phone layout */
@media(max-width:650px){
  body{background:#f4f5f7;-webkit-text-size-adjust:100%;}
  .wrap{width:100%;max-width:none;margin:0;padding:10px;}
  .card{border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 6px #0001;}
  h1{font-size:26px;margin-bottom:6px;}
  h2{font-size:20px;margin-bottom:10px;}
  label{font-size:14px;margin-top:10px;}
  input,select,button{font-size:17px;min-height:48px;border-radius:10px;}
  button{margin-top:8px;}
  .eye-btn{min-height:42px;height:42px;margin-top:0;font-size:21px;}
  .grid,.actions{grid-template-columns:1fr;gap:8px;}
  .top{display:flex;flex-direction:row;align-items:center;gap:8px;}
  .top button{width:auto;min-width:92px;margin:0;}
  .stock{padding:12px;margin-top:8px;border-radius:10px;}
  .stock h3{font-size:17px;}
  .adminrow{flex-direction:column;align-items:stretch;gap:8px;}
  .adminrow button{width:100%;}
  .price{font-size:14px;}
  .suggest{font-size:12px;line-height:1.35;}
  .msg{font-size:14px;margin-bottom:10px;}
  .empty{padding:16px 8px;}
}
@media(min-width:651px){
  .phone-only{display:none!important;}
}

function parseSize(s){
  const m=String(s||'').trim().match(/^(\d{3})\/(\d{2})\/(\d{2})$/);
  if(!m)return null;
  return{width:+m[1],profile:+m[2],rim:+m[3]};
}

/* 205 -> 205/ -> 205/40/ -> 205/40/17 -> DOT */
$("size").oninput=function(){
  const d=this.value.replace(/\D/g,'').slice(0,7);
  let o=d;
  if(d.length>=3){
    o=d.slice(0,3)+'/';
  }
  if(d.length>=4){
    o=d.slice(0,3)+'/'+d.slice(3,5);
  }
  if(d.length>=5){
    o=d.slice(0,3)+'/'+d.slice(3,5)+'/';
  }
  if(d.length>=6){
    o=d.slice(0,3)+'/'+d.slice(3,5)+'/'+d.slice(5,7);
  }
  this.value=o;
  if(d.length===7){
    $("dot").focus();
  }
};

$("dot").oninput=function(){
  this.value=this.value.replace(/\D/g,'').slice(0,4);
  if(this.value.length===4){
    const w=+this.value.slice(0,2),y=+this.value.slice(2);
    if(w>=1&&w<=53){
      const yr=2000+y;
      const d=new Date(Date.UTC(yr,0,4));
      const day=d.getUTCDay()||7;
      d.setUTCDate(d.getUTCDate()-day+1+(w-1)*7);
      this.dataset.date=d.toISOString().slice(0,10);
    }
  }
};

function dateToDot(dateStr){
  if(!dateStr)return'';
  const d=new Date(dateStr+'T12:00:00Z');
  if(isNaN(d))return'';
  const target=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  const day=target.getUTCDay()||7;
  target.setUTCDate(target.getUTCDate()+4-day);
  const year=target.getUTCFullYear();
  const first=new Date(Date.UTC(year,0,1));
  const week=Math.ceil((((target-first)/86400000)+1)/7);
  return String(week).padStart(2,'0')+String(year).slice(-2);
}

function dotToDate(dot){
  if(!/^\d{4}$/.test(dot))return null;
  const w=+dot.slice(0,2),yr=2000+(+dot.slice(2));
  if(w<1||w>53)return null;
  const d=new Date(Date.UTC(yr,0,4));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()-day+1+(w-1)*7);
  return d.toISOString().slice(0,10);
}

async function admin(){

async function loadShop(){

  if(error)throw error;
  const x=(data||[]).find(r=>r.shops&&r.shops.is_active!==false);
  if(!x)throw Error('No shop assigned to this account.');
  currentShop=x.shops;
  $("shopTitle").textContent=currentShop.name;
}

async function loadShops(){
  const{data,error}=await db.rpc('admin_get_shops');

async function loadTyres(){
  const{data,error}=await db.from('tyres').select('*').eq('shop_id',currentShop.id).order('created_at',{ascending:false});
  if(error)throw error;
  currentTyres=data||[];
  renderTyres();
  if($("stockSearchBrand")) populateStockSearchFilters();

function tyreCard(t){
  return `<div class="stock"><h3>${esc(t.brand)} ${esc(t.model)}</h3><div><b>${esc(t.size||`${t.width}/${t.profile}/${t.rim}`)}</b></div><div class="muted">DOT: ${esc(dateToDot(t.date)||'-')} · Condition: ${esc(t.tyre_condition||'New')} · Qty: ${esc(t.quantity)}</div><div class="price">€${t.sale_price==null?'—':Number(t.sale_price).toFixed(2)}</div><div class="actions"><button class="secondary" type="button" onclick="editTyre('${t.id}')">Edit</button><button class="danger" type="button" onclick="deleteTyre('${t.id}')">Delete</button></div></div>`;
}

function renderTyres(){
  if(!currentTyres.length){
    $("stockList").innerHTML='<div class="empty">No tyres in stock.</div>';
    return;
  }
  $("stockList").innerHTML=currentTyres.map(tyreCard).join('');
}

function normalizeSize(value){
  return String(value||'').replace(/\D/g,'');

function populateStockSearchFilters(){
  const brandSel=$("stockSearchBrand");
  const brands=[...new Set(currentTyres.map(t=>String(t.brand||'').trim()).filter(Boolean))].sort();
  brandSel.innerHTML='<option value="">All brands</option>'+brands.map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
  updateStockSearchModels();
}

function updateStockSearchModels(){
  const brand=$("stockSearchBrand").value;
  const models=[...new Set(currentTyres.filter(t=>!brand||String(t.brand||'')===brand).map(t=>String(t.model||'').trim()).filter(Boolean))].sort();
  $("stockSearchModel").innerHTML='<option value="">All models</option>'+models.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join('');
}

function searchStock(){
  const raw=$("stockSearch").value.trim();
  const q=normalizeSize(raw);
  const brand=$("stockSearchBrand").value;
  const model=$("stockSearchModel").value;
  const condition=$("stockSearchCondition").value;
  const box=$("stockSearchResult");
  if(!q&&!brand&&!model&&!condition){
    box.classList.remove('hidden');
    box.innerHTML='<div class="empty">Choose a filter or enter a size to search your stock.</div>';
    return;
  }
  const matches=currentTyres.filter(t=>{
    const sizeOk=!q||normalizeSize(t.size||`${t.width}/${t.profile}/${t.rim}`)===q;
    const brandOk=!brand||String(t.brand||'')===brand;
    const modelOk=!model||String(t.model||'')===model;
    const conditionOk=!condition||String(t.tyre_condition||'New')===condition;
    return sizeOk&&brandOk&&modelOk&&conditionOk;
  });
  box.classList.remove('hidden');
  if(!matches.length){
    box.innerHTML='<div class="empty">No stock found.</div>';
    return;
  }
  const total=matches.reduce((sum,t)=>sum+Number(t.quantity||0),0);
  box.innerHTML='<div style="margin-bottom:10px"><b>In stock: '+total+'</b></div>'+matches.map(tyreCard).join('');
}

populateStockSearchFilters();
$("stockSearchBrand").onchange=updateStockSearchModels;
$("stockSearchBtn").onclick=searchStock;
$("stockSearchClearBtn").onclick=()=>{
  $("stockSearch").value='';
  $("stockSearchBrand").value='';
  updateStockSearchModels();
  $("stockSearchModel").value='';
  $("stockSearchCondition").value='';
  $("stockSearchResult").classList.add('hidden');
  $("stockSearchResult").innerHTML='';
};
$("stockSearch").addEventListener('keydown',e=>{if(e.key==='Enter')searchStock();});

window.editTyre=function(id){
  const t=currentTyres.find(x=>x.id===id);
  if(!t)return;
  editTyreId=id;
  $("formTitle").textContent='Edit Tyre';
  $("saveTyreBtn").textContent='Save Changes';
  $("cancelEditBtn").classList.remove('hidden');
  populateBrands(t.brand);
  $("brand").value=t.brand;
  updateModels(t.model);
  $("size").value=t.size||`${t.width}/${t.profile}/${t.rim}`;
  $("dot").value=dateToDot(t.date);
  $("tyreCondition").value=t.tyre_condition||'New';
  $("quantity").value=t.quantity??1;
  $("salePrice").value=t.sale_price??'';
  window.scrollTo({top:0,behavior:'smooth'});
};

window.deleteTyre=async function(id){
  if(!confirm('Delete this tyre?'))return;
  const{error}=await db.from('tyres').delete().eq('id',id).eq('shop_id',currentShop.id);
  if(error){msg('ERROR: '+error.message,true);return}
  msg('Tyre deleted.');
  await loadTyres();
};

/* Password reset */
$("forgotPasswordBtn").onclick=async()=>{
  try{
    const email=$("email").value.trim();
    if(!email)throw Error("Enter your email first.");
    msg("Sending password reset email...");
    const redirectTo=window.location.href.split("#")[0];
    const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    msg("If this email is registered, you will receive a password reset email.");
  }catch(e){
    console.error(e);
    msg("ERROR: "+(e.message||e),true);
  }
};

function showPasswordReset(){
  $("loginBox").classList.add("hidden");
  $("adminBox").classList.add("hidden");
  $("shopBox").classList.add("hidden");
  $("resetBox").classList.remove("hidden");
  msg("Enter your new password.");
}

db.auth.onAuthStateChange((event)=>{
  if(event==="PASSWORD_RECOVERY") showPasswordReset();
});

// Also handle recovery links directly from the email URL.
if(window.location.hash.includes("type=recovery")){
  showPasswordReset();
  db.auth.getSession().then(({data,error})=>{
    if(error) msg("ERROR: "+error.message,true);
    else if(!data.session) msg("The password reset link is invalid or expired.",true);
  });
}

$("savePasswordBtn").onclick=async()=>{
  try{
    const p1=$("newPassword").value;
    const p2=$("newPassword2").value;
    if(!p1||p1.length<6)throw Error("Password must be at least 6 characters.");
    if(p1!==p2)throw Error("Passwords do not match.");
    const{error}=await db.auth.updateUser({password:p1});
    if(error)throw error;
    await db.auth.signOut();
    $("resetBox").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    $("newPassword").value="";
    $("newPassword2").value="";
    msg("Password changed successfully. You can now log in.");
  }catch(e){
    console.error(e);
    msg("ERROR: "+(e.message||e),true);
  }
};

/* Login */
$("loginBtn").onclick=async()=>{
  const btn=$("loginBtn");
  if(btn.disabled)return;
  btn.disabled=true;
  try{
    const email=$("email").value.trim();
    const pass=$("password").value;
    if(!email||!pass)throw Error('Enter email and password.');
    msg('Logging in...');
    const result=await db.auth.signInWithPassword({email:email,password:pass});
    if(result.error)throw result.error;
    currentUser=result.data.user;
    const isAdmin=await admin();
    if(isAdmin){
      $("loginBox").classList.add('hidden');
      $("shopBox").classList.add('hidden');
      $("adminBox").classList.remove('hidden');
      msg('Logged in as G Tyres Admin.');
      await loadShops();
    }else{
      await loadShop();
      $("loginBox").classList.add('hidden');
      $("adminBox").classList.add('hidden');
      $("shopBox").classList.remove('hidden');
      msg('Logged in as '+currentShop.name+'.');
      await loadTyres();
    }
  }catch(e){
    console.error(e);
    msg('ERROR: '+(e.message||e),true);
  }finally{
    btn.disabled=false;
  }
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("loginBtn").click();
});

$("shopLogoutBtn").onclick=async()=>{
  await db.auth.signOut();
  currentUser=null;
  currentShop=null;
  $("adminBox").classList.add('hidden');
  $("shopBox").classList.add('hidden');
  $("loginBox").classList.remove('hidden');
  $("password").value='';
  msg('Logged out.');
};

$("adminLogoutBtn").onclick=async()=>{
  await db.auth.signOut();
  currentUser=null;
  currentShop=null;
  $("adminBox").classList.add('hidden');
  $("shopBox").classList.add('hidden');
  $("loginBox").classList.remove('hidden');
  $("password").value='';
  msg('Logged out.');
};

async function restore(){
  try{
    const{data,error}=await db.auth.getSession();
    if(error)throw error;
    if(!data.session)return;
    currentUser=data.session.user;
    const isAdmin=await admin();
    if(isAdmin){
      $("loginBox").classList.add('hidden');
      $("shopBox").classList.add('hidden');
      $("adminBox").classList.remove('hidden');
      await loadShops();
      msg('Logged in as G Tyres Admin.');
    }else{
      await loadShop();
      $("loginBox").classList.add('hidden');
      $("adminBox").classList.add('hidden');
      $("shopBox").classList.remove('hidden');
      await loadTyres();
      msg('Logged in as '+currentShop.name+'.');
    }
  }catch(e){
    console.error(e);
    await db.auth.signOut();
    msg('Session error: '+(e.message||e),true);
  }
}

populateBrands();
restore();

})();
</script>
